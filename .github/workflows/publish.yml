name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install semantic-release
        run: npm install --global semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/exec @semantic-release/github @semantic-release/git

      - name: Create semantic release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release

      - name: Resolve release version
        id: release-version
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath '.semantic-release-version') {
            "value=$(Get-Content -LiteralPath '.semantic-release-version' -Raw)" >> $env:GITHUB_OUTPUT
          }

      - uses: andriivitiv/setup-steamcmd@v1
        if: steps.release-version.outputs.value != ''
        id: steamcmd

      - name: Download ONI assemblies
        if: steps.release-version.outputs.value != ''
        id: oni
        shell: pwsh
        run: |
          $steamConfig = Join-Path '${{ steps.steamcmd.outputs.directory }}' 'config'
          New-Item -ItemType Directory -Path $steamConfig -Force | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $steamConfig 'config.vdf'), [Convert]::FromBase64String($env:STEAM_CONFIG_VDF))
          $oni = Join-Path $env:RUNNER_TEMP 'oni'
          & '${{ steps.steamcmd.outputs.executable }}' +login "$env:STEAM_USERNAME" +force_install_dir "$oni" +app_update 457140 validate +quit
          $managed = Join-Path $oni 'OxygenNotIncluded_Data\Managed'
          if (-not (Test-Path -LiteralPath (Join-Path $managed 'Assembly-CSharp.dll'))) { throw 'SteamCMD did not install ONI managed assemblies.' }
          "path=$managed" >> $env:GITHUB_OUTPUT

      - name: Build release
        if: steps.release-version.outputs.value != ''
        shell: pwsh
        run: |
          dotnet restore CustomizableEnergy.csproj -p:GameManagedPath="${{ steps.oni.outputs.path }}" -p:GameFolder="${{ steps.oni.outputs.path }}"
          dotnet build CustomizableEnergy.csproj --configuration Release --no-restore -p:GameManagedPath="${{ steps.oni.outputs.path }}" -p:GameFolder="${{ steps.oni.outputs.path }}" -p:Version="${{ steps.release-version.outputs.value }}"

      - name: Package ONI Uploader artifact
        if: steps.release-version.outputs.value != ''
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'CustomizableEnergy'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item 'bin\Release\netstandard2.1\CustomizableEnergy.dll' $staging
          Copy-Item 'mod.yaml','mod_info.yaml','README.md' $staging
          Copy-Item 'third_party\ONIMods\PLibCore\bin\Release\netstandard2.1\PLibCore.dll' $staging
          Copy-Item 'third_party\ONIMods\PLibUI\bin\Release\netstandard2.1\PLibUI.dll' $staging
          Copy-Item 'third_party\ONIMods\PLibOptions\bin\Release\netstandard2.1\PLibOptions.dll' $staging
          Compress-Archive -Path "$staging\*" -DestinationPath "CustomizableEnergy-v${{ steps.release-version.outputs.value }}.zip" -Force

      - name: Upload release artifact
        if: steps.release-version.outputs.value != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "v${{ steps.release-version.outputs.value }}" "CustomizableEnergy-v${{ steps.release-version.outputs.value }}.zip" --clobber
